name: Legislator bio/photo backfill

# Backfills legislators.bio_summary/photo_url from Wikipedia — a separate,
# much more frequent schedule from sync.yml's weekly full sync, because the
# population here (~12,700 legislators, current + full House/Senate
# history) makes one full pass take multiple days even at the deliberately
# low concurrency this needs (see legislators.mjs's own comments — going
# higher reliably produces more 429s from Wikipedia's REST API, not less).
# Each run is bounded to a short time budget and just picks up wherever
# bio_summary IS NULL next (LEGISLATORS_BACKFILL_ONLY skips re-syncing
# legislators/terms from congress-legislators entirely, so a run every few
# hours doesn't repeatedly churn the 45k-row terms table for no reason —
# that stays on sync.yml's weekly cadence). Self-healing/idempotent by
# design, so a missed or overlapping run is harmless.
#
# Cadence/budget tuned from a real run's numbers, not guessed: a manual
# trigger processed 255 people in a 20-minute budget with only 2 failures
# (both transient 429s, both correctly left for the next run to retry —
# see legislators.mjs's `bio_summary IS NULL` re-query). At the original
# every-3-hours/20-min settings that's ~6 days to clear the backlog;
# hourly + a slightly longer budget cuts that to under 2 days — this
# scales cadence and budget, NOT concurrency, which is the one lever
# already proven to make things worse, not better, if pushed further.
on:
  # 17 minutes past the hour, not exactly on it — GitHub's own guidance is
  # that scheduled workflows can be delayed under high platform load, and
  # the top of every hour is the single most congested moment since huge
  # numbers of repos worldwide use round-number schedules. This workflow's
  # schedule trigger never fired even once in its first several hours live
  # (confirmed via `gh run list` — zero runs with event "schedule", only
  # manual `workflow_dispatch` ones) — not a config bug (everything else
  # checked out: workflow registered "active", repo not a fork/in an org,
  # Actions enabled, YAML valid), genuinely GitHub-side and outside our
  # control to fully fix; this offset plus re-saving the file (which
  # sometimes re-registers a stuck schedule) are the two real mitigations
  # worth trying, not a guaranteed fix.
  schedule:
    - cron: "17 * * * *" # every hour, offset from the top of the hour
  workflow_dispatch: {} # allow an on-demand run from the Actions tab

# Hourly with a ~25min budget leaves less slack than the old 3-hourly/20min
# pairing — if a run ever runs long, the next hourly trigger could
# otherwise start while the previous one is still finishing, and both
# would query/process the same bio_summary IS NULL set at once (wasted
# duplicate work, not incorrect, since updates are idempotent — but still
# worth avoiding). Queues instead of overlapping; doesn't cancel an
# in-progress run's work.
concurrency:
  group: legislator-bio-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 32 # safety margin above BACKFILL_BUDGET_MS below
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SYNC_TRIGGERED_BY: cron
      LEGISLATORS_BACKFILL_ONLY: "true"
      BACKFILL_BUDGET_MS: "1500000" # 25 minutes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/sync/legislators.mjs
